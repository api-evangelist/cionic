apis:
- aid: cionic:research-platform-api
  name: CIONIC Research Platform API
  description: 'The collections service of the CIONIC research platform. Path-versioned
    REST endpoints under /c/v{version}/{org}/ covering studies, protocols and protocol
    versions, collections and their files, streams and neighbors, participants, jobs,
    surveys and apps. Requests carry an x-cionic-user token; anonymous requests are
    rejected with 401. File upload is a three-step flow — request a signed storage
    URL, PUT the file, then confirm the upload against the collection.'
  humanURL: https://cionic.com/platform
  baseURL: https://cionic.com/c/v2.0/
