- aid: cionic:accounts-api
  name: CIONIC Accounts API
  description: 'The accounts service of the CIONIC research platform. Path-versioned
    REST endpoints under /a/v{version}/ covering account lookup and creation, the
    /accounts/@me self endpoint, downloadable access tokens, participant lists,
    timezone, per-organization role grants (analyst, collector, admin), chats and
    appointments. Fronted by an OAuth 2.0 authorization-code flow at /oauth/authorize
    and /oauth/token with a /oauth/user token-exchange endpoint.'
  humanURL: https://cionic.com/platform
  baseURL: https://cionic.com/a/v2.0/
