aid: cionic
name: CIONIC
description: 'CIONIC Inc. is a neurotechnology company in Scotts Valley, California,
  founded in 2018 by Jeremiah Robison, that builds "bionic clothing" for people with
  neurological conditions that affect walking. Its flagship product, the FDA-cleared
  Cionic Neural Sleeve, combines inertial and surface-EMG sensing with functional
  electrical stimulation to analyze gait and assist dorsiflexion in conditions such
  as foot drop, multiple sclerosis, stroke and cerebral palsy. Alongside the consumer
  device CIONIC operates a research platform — the Cionic Research Kit — offering
  on-body hardware, iOS and Android collection apps, a web research portal for study
  and protocol management, a hosted JupyterLab analysis environment, and HIPAA-compliant
  participant data infrastructure. The company publishes an open-source Python client
  and command-line tooling for that platform''s REST APIs, but the API reference and
  machine-readable contract itself sit behind a researcher account.'
